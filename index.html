<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스네이크 게임</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>스네이크 게임</h1>

    <!-- 점수 / 레벨 / 최고 점수 표시: 동일한 모양의 타일 3개 -->
    <div class="stats">
      <div class="stat">
        <span class="stat-label">점수</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">레벨</span>
        <span class="stat-value" id="level">1</span>
      </div>
      <div class="stat">
        <span class="stat-label">최고 점수</span>
        <span class="stat-value" id="high-score">0</span>
        <button id="reset-highscore-btn" class="reset-btn" type="button">초기화</button>
      </div>
    </div>

    <!-- 400x400, 20x20 격자로 그려지는 게임 캔버스 -->
    <div class="board-wrap">
      <canvas id="game-canvas" width="400" height="400"></canvas>

      <!-- 게임오버/퀘스트 성공 시에만 표시되는 오버레이 (JS가 메시지와 색상 클래스를 갈아끼움) -->
      <div id="game-over-overlay" class="overlay hidden">
        <!-- 퀘스트 성공 시 이미지 주변에 터지는 폭죽 조각들이 JS로 채워지는 자리 -->
        <div id="confetti-container" class="confetti-container"></div>
        <!-- 퀘스트 성공 시에만 보이는 아이콘 (게임 오버 때는 JS가 hidden 처리) -->
        <img id="success-icon" class="success-icon hidden" src="success-icon.png" alt="퀘스트 성공" />
        <p id="overlay-message">게임 오버</p>
        <button id="restart-btn">다시 시작</button>
      </div>
    </div>

    <!-- 난이도 선택 + 시작/일시정지 버튼을 한 컨트롤 영역으로 묶음.
         2열 그리드로 배치해 모드/난이도, 문구/색상이 각각 세로로 줄맞춰 보이게 함 -->
    <div class="controls">
      <!-- 일반: 무한 랜덤 먹이 / 퀘스트: 지정한 문구를 글자 모양의 먹이들로 표현하고 완성하면 성공.
           드롭다운 대신 버튼 두 개 중 하나를 클릭해서 고르는 방식 -->
      <div class="control-group">
        <label>모드:</label>
        <div class="mode-toggle" id="mode-toggle">
          <button type="button" class="mode-btn active" data-mode="normal">일반</button>
          <button type="button" class="mode-btn" data-mode="quest">퀘스트</button>
        </div>
      </div>

      <!-- 문구는 항상 표시하되, 일반 모드에서는 비활성화(퀘스트 모드일 때만 선택 가능) -->
      <div class="control-group">
        <label for="quest-phrase">문구:</label>
        <!-- value에 있는 공백은 buildQuestCells()가 줄바꿈 기준으로 쓰는 표시라 "SNAKE"를
             "SNA"/"KE" 두 줄로 나누기 위한 것. 드롭다운에는 원래 철자(공백 없이) 그대로 보여줌 -->
        <select id="quest-phrase" disabled>
          <option value="GAME" selected>GAME</option>
          <option value="SNA KE">SNAKE</option>
          <option value="NCT 127">NCT 127</option>
          <option value="DY♥ LOVE">DY♥ LOVE</option>
          <option value="MISS YOU">MISS YOU</option>
        </select>
      </div>

      <div class="control-group">
        <label for="difficulty">난이도:</label>
        <select id="difficulty">
          <option value="easy">쉬움</option>
          <option value="normal" selected>보통</option>
          <option value="hard">어려움</option>
          <option value="veryhard">매우 어려움</option>
        </select>
      </div>

      <!-- 뱀 색상 선택: 게임 중에도 즉시 반영되는 순수 표시용 설정이라 비활성화하지 않음 -->
      <div class="control-group">
        <label for="snake-color">뱀 색상:</label>
        <input type="color" id="snake-color" value="#4ade80" />
      </div>

      <div class="button-row">
        <!-- 최초 진입 시 게임을 시작하는 버튼 -->
        <button id="start-btn">게임 시작</button>

        <!-- 게임 진행 중에만 표시되는 일시정지 버튼 -->
        <button id="pause-btn" class="hidden">일시정지</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
