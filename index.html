<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스네이크 게임</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="title-row">
      <h1>스네이크 게임</h1>
      <!-- 처음 보는 사람도 규칙을 알 수 있도록 언제든 다시 열어볼 수 있는 도움말 버튼 -->
      <button id="help-btn" class="help-btn" type="button" aria-label="게임 방법 보기">?</button>
    </div>

    <!-- 점수 / 레벨 / 최고 점수 표시: 동일한 모양의 타일 3개 -->
    <div class="stats">
      <div class="stat">
        <span class="stat-label">점수</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">레벨</span>
        <span class="stat-value" id="level">1</span>
      </div>
      <div class="stat">
        <span class="stat-label">최고 점수</span>
        <span class="stat-value" id="high-score">0</span>
        <button id="reset-highscore-btn" class="reset-btn" type="button">초기화</button>
      </div>
    </div>

    <!-- 400x400, 20x20 격자로 그려지는 게임 캔버스 -->
    <div class="board-wrap">
      <canvas id="game-canvas" width="400" height="400"></canvas>

      <!-- 게임오버/퀘스트 성공 시에만 표시되는 오버레이 (JS가 메시지와 색상 클래스를 갈아끼움) -->
      <div id="game-over-overlay" class="overlay hidden">
        <!-- 퀘스트 성공 시 이미지 주변에 터지는 폭죽 조각들이 JS로 채워지는 자리 -->
        <div id="confetti-container" class="confetti-container"></div>
        <!-- 퀘스트 성공 시에만 보이는 트로피 + 팡파레 섬광 효과 (게임 오버 때는 JS가 hidden 처리) -->
        <div class="trophy-wrap">
          <div id="trophy-burst" class="trophy-burst hidden" aria-hidden="true"></div>
          <span id="success-icon" class="success-icon hidden">🏆</span>
        </div>
        <p id="overlay-message">게임 오버</p>
        <button id="restart-btn">다시 시작</button>
      </div>
    </div>

    <!-- 모바일 터치 조작용 방향 버튼. 키보드 방향키와 동일한 로직(changeDirection)을 사용함 -->
    <div class="dpad" id="dpad">
      <button type="button" class="dpad-btn dpad-up" data-dir="up" aria-label="위로">▲</button>
      <button type="button" class="dpad-btn dpad-left" data-dir="left" aria-label="왼쪽으로">◀</button>
      <button type="button" class="dpad-btn dpad-right" data-dir="right" aria-label="오른쪽으로">▶</button>
      <button type="button" class="dpad-btn dpad-down" data-dir="down" aria-label="아래로">▼</button>
    </div>

    <!-- 난이도 선택 + 시작/일시정지 버튼을 한 컨트롤 영역으로 묶음.
         2열 그리드로 배치해 모드/난이도, 문구/색상이 각각 세로로 줄맞춰 보이게 함 -->
    <div class="controls">
      <!-- 일반: 무한 랜덤 먹이 / 퀘스트: 지정한 문구를 글자 모양의 먹이들로 표현하고 완성하면 성공.
           드롭다운 대신 버튼 두 개 중 하나를 클릭해서 고르는 방식 -->
      <div class="control-group">
        <label>모드:</label>
        <div class="mode-toggle" id="mode-toggle">
          <button type="button" class="mode-btn active" data-mode="normal">일반</button>
          <button type="button" class="mode-btn" data-mode="quest">퀘스트</button>
        </div>
      </div>

      <!-- 문구는 항상 표시하되, 일반 모드에서는 비활성화(퀘스트 모드일 때만 선택 가능) -->
      <div class="control-group">
        <label for="quest-phrase">문구:</label>
        <!-- value에 있는 공백은 buildQuestCells()가 줄바꿈 기준으로 쓰는 표시라 "SNAKE"를
             "SNA"/"KE" 두 줄로 나누기 위한 것. 드롭다운에는 원래 철자(공백 없이) 그대로 보여줌 -->
        <select id="quest-phrase" disabled>
          <option value="SNA KE">SNAKE</option>
          <option value="GAME" selected>GAME</option>
          <option value="GOOD LUCK">GOOD LUCK</option>
          <option value="SPE CIAL">SPECIAL</option>
        </select>
      </div>

      <div class="control-group">
        <label for="difficulty">난이도:</label>
        <select id="difficulty">
          <option value="easy">쉬움</option>
          <option value="normal" selected>보통</option>
          <option value="hard">어려움</option>
          <option value="veryhard">매우 어려움</option>
        </select>
      </div>

      <!-- 뱀 색상 선택: 게임 중에도 즉시 반영되는 순수 표시용 설정이라 비활성화하지 않음 -->
      <div class="control-group">
        <label for="snake-color">뱀 색상:</label>
        <input type="color" id="snake-color" value="#4ade80" />
      </div>

      <div class="button-row">
        <!-- 최초 진입 시 게임을 시작하는 버튼 -->
        <button id="start-btn">게임 시작</button>

        <!-- 게임 진행 중에만 표시되는 일시정지 버튼 -->
        <button id="pause-btn" class="hidden">일시정지</button>
      </div>
    </div>
  </div>

  <!-- 게임 방법 도움말. .card 밖(body 최상위)에 둬서 카드의 max-height/overflow:hidden 제약과
       무관하게 화면 전체 기준으로 뜨도록 함. 처음 방문 시 자동으로 한 번 열리고, ? 버튼으로 언제든 다시 볼 수 있음 -->
  <div id="help-modal" class="help-modal hidden">
    <div class="help-modal-box">
      <h2>게임 방법</h2>
      <ul>
        <li>방향키(↑↓←→) 또는 화면 아래 방향 버튼으로 뱀을 조작해요.</li>
        <li>먹이를 먹으면 점수가 오르고, 벽이나 자기 몸에 부딪히면 게임이 끝나요.</li>
        <li><strong>일반</strong> 모드: 먹이가 계속 무작위로 나와요. 오래 살아남을수록 고득점!</li>
        <li><strong>퀘스트</strong> 모드: 고른 문구 모양대로 나온 먹이를 전부 먹으면 성공이에요.</li>
        <li>난이도와 뱀 색상은 시작 전에 원하는 대로 바꿀 수 있어요.</li>
      </ul>
      <button id="help-close-btn" type="button">확인</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
